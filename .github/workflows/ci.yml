name: Test CI/CD
run-name: ${{ github.actor }} is testing the workflow!
on:
  push:
    branches:
      - phananh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with Maven
        run: |
          chmod +x mvnw
          ./mvnw test

      - name: Build with Maven
        run: ./mvnw package -DskipTests

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.D_USERNAME }}
          password: ${{ secrets.D_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.D_USERNAME }}/testcicd:${{ github.sha }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Đăng nhập Docker Hub
            echo "${{ secrets.D_PASSWORD }}" | docker login -u "${{ secrets.D_USERNAME }}" --password-stdin
            
            # Di chuyển vào thư mục dự án
            cd ~/deploy
            
            # Sử dụng lệnh docker-compose cũ (có gạch nối)
            export TAG=${{ github.sha }}
            docker-compose pull
            docker-compose up -d